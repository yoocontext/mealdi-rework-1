services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mealdi
      POSTGRES_USER: mealdi
      POSTGRES_PASSWORD: mealdi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealdi -d mealdi"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mealdi-postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      MEALDI_DATABASE_URL: postgresql+asyncpg://mealdi:mealdi@postgres:5432/mealdi
      MEALDI_JWT_SECRET: ${MEALDI_JWT_SECRET:-development-only-change-this-secret}
    command: sh -c "alembic upgrade head && uvicorn bootstrap.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mealdi-postgres:
